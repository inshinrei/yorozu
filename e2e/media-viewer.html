<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>media-viewer e2e</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
            }
            #gallery {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                padding: 16px;
            }
            #gallery button {
                width: 80px;
                height: 80px;
                padding: 0;
                border: 0;
                background: #ddd;
            }
            #gallery img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            [data-yorozu-media-header] > * {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                padding: 8px;
            }
            [data-yorozu-media-header] button {
                min-height: 32px;
            }
        </style>
    </head>
    <body>
        <div id="gallery">
            <button type="button" data-id="img-0" data-yorozu-media-origin="img-0">
                <img src="/media/img.jpg" alt="" />
            </button>
            <button type="button" data-id="img-1" data-yorozu-media-origin="img-1">
                <img src="/media/img.jpg" alt="" />
            </button>
            <button type="button" data-id="img-2" data-yorozu-media-origin="img-2">

            </button>
            <button type="button" data-id="img-3" data-yorozu-media-origin="img-3">

            </button>
            <button type="button" data-id="img-4" data-yorozu-media-origin="img-4">

            </button>
            <button type="button" data-id="img-5" data-yorozu-media-origin="img-5">

            </button>
            <button type="button" data-id="gif-0" data-yorozu-media-origin="gif-0">

            <button type="button" data-id="vid-0" data-yorozu-media-origin="vid-0">
                <img src="/media/img.jpg" alt="" />
            </button>
        </div>
        <script type="module" src="/src/media-viewer.ts"></script>

</html>
