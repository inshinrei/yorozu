<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>media-viewer e2e</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
            }
            #gallery {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                padding: 16px;
            }
            #gallery button {
                width: 80px;
                height: 80px;
                padding: 0;
                border: 0;
                background: #ddd;
            }
            #gallery img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            [data-yorozu-media-header] > * {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                padding: 8px;
            }
            [data-yorozu-media-header] button {
                min-height: 32px;
            }
        </style>
    </head>
    <body>
        <div id="gallery"></div>
        <script type="module" src="/src/media-viewer.ts"></script>
    </body>
</html>
