name: E2E
on:
    pull_request:
    push:
        branches: [main]
jobs:
    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install
            - run: pnpm exec playwright install --with-deps chromium
            - name: E2E changed
              run: pnpm exec tsx packages/build/src/cli/main.ts e2e --changed --since=${{ github.event.pull_request.base.sha || github.event.before }}
